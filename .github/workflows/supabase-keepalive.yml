# .github/workflows/supabase-keepalive.yml
# Keep both Supabase projects active.
# Free-tier projects pause after 7 days without "activity". REST reads don't
# reliably reset that clock — writes do. Each run upserts a row in the
# singleton `keepalive` table.

name: Supabase Keep-Alive

on:
  # Mon/Wed/Fri at 12:00 UTC — at most 3 days between runs, well under the
  # 7-day pause window even if two consecutive runs fail.
  schedule:
    - cron: '0 12 * * 1,3,5'

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: prod
            url_secret: SUPABASE_URL_PROD
            key_secret: SUPABASE_SERVICE_KEY_PROD
          - name: staging
            url_secret: SUPABASE_URL_STAGING
            key_secret: SUPABASE_SERVICE_KEY_STAGING

    steps:
      - name: Ping ${{ matrix.name }}
        env:
          SUPABASE_URL: ${{ secrets[matrix.url_secret] }}
          SUPABASE_KEY: ${{ secrets[matrix.key_secret] }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Missing secrets for ${{ matrix.name }}"
            exit 1
          fi
          NOW=$(date -u +%FT%TZ)
          # Upsert the singleton keepalive row. POST with merge-duplicates
          # works whether the row exists yet or not, and the PK conflict
          # target (id=1) is inferred automatically.
          curl -fsS \
            -X POST \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            "$SUPABASE_URL/rest/v1/keepalive" \
            -d "{\"id\":1,\"updated_at\":\"$NOW\"}" \
            > /dev/null
          echo "Pinged ${{ matrix.name }} at $NOW"
